[project]
name = "tgpanel"
version = "0.1.0"
description = "Web panel and Telegram bot for tproxy-server"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "aiogram>=3,<4",
    "jinja2",
    "python-multipart",
    "argon2-cffi",
    "segno",
    "itsdangerous",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy"]

[project.scripts]
tgpanel = "tgpanel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tgpanel*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tgpanel/**" = ["RUF001", "RUF002", "RUF003"]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tgpanel", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
