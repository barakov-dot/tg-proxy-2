{% extends 'base.html' %}
{% from '_macros.html' import icon with context %}
{% block title %}{{ t.nav_import }}{% endblock %}
{% block content %}
<div class="page-head"><h1>{{ t.nav_import }}</h1></div>
<div class="alert warn">{{ icon('alert') }} {{ t.import_stop_old_bot }}</div>
{% if error %}<div class="alert err" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="{{ url('/import/preview') }}" enctype="multipart/form-data" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <div class="form-grid">
    <label>{{ t.import_regex }} <input name="regex" value="{{ regex }}" maxlength="200" class="wide"></label>
    <label>{{ t.import_csv_file }} <input type="file" name="csv_file" accept=".csv,.txt" class="wide"></label>
    <label class="wide-field">{{ t.import_csv_text }} <textarea name="csv_text" rows="5"></textarea></label>
  </div>
  <p><button type="submit" class="primary">{{ icon('search') }} {{ t.import_preview }}</button></p>
</form>
{% endblock %}
