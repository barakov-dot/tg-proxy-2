{% from '_macros.html' import icon with context %}
<div class="reveal">
{% if error %}<div class="alert err">{{ error }}</div>
{% else %}
<p><strong>{{ icon('link') }} {{ t.link_https }}</strong><br><code>{{ https_link }}</code> <button type="button" class="icon" data-copy="{{ https_link }}" aria-label="{{ t.copy }}" title="{{ t.copy }}">{{ icon('copy') }}</button></p>
<p><strong>{{ icon('link') }} {{ t.link_tg }}</strong><br><code>{{ tg_link }}</code> <button type="button" class="icon" data-copy="{{ tg_link }}" aria-label="{{ t.copy }}" title="{{ t.copy }}">{{ icon('copy') }}</button></p>
<p><strong>{{ t.secret }}</strong><br><code>{{ secret }}</code></p>
<div class="qr" role="img" aria-label="QR">{{ qr }}</div>
<button type="button" data-hide>{{ icon('x') }} {{ t.hide }}</button>
{% endif %}
</div>
