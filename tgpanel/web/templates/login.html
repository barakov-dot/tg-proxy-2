{% extends 'base.html' %}
{% from '_macros.html' import icon with context %}
{% block title %}{{ t.login_title }}{% endblock %}
{% block content %}
<section class="card login-card">
  <div class="brand">{{ icon('shield') }} {{ t.app_name }}</div>
  <h1>{{ t.login_title }}</h1>
  {% if error %}<div class="alert err" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url('/login') }}" autocomplete="off">
    <input type="hidden" name="login_token" value="{{ login_token }}">
    <label>{{ t.login_user }} <input name="username" required maxlength="100" autofocus class="wide"></label>
    <label>{{ t.login_password }} <input type="password" name="password" required maxlength="1024" class="wide"></label>
    <button type="submit" class="primary">{{ icon('lock') }} {{ t.login_submit }}</button>
  </form>
</section>
{% endblock %}
