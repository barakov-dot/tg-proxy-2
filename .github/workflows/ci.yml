name: ci
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install pinned dev dependencies (hashes)
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          pip install --no-deps -e .
      - run: ruff check .
      - run: mypy
      - run: pytest
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          files="$(git ls-files '*.sh') deploy/tgpanel-cli"
          shellcheck $files
  lock:
    # requirements.lock must install with hashes on both target Pythons and match pyproject
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install with hashes, binary wheels only (dry run)
        run: |
          pip install --require-hashes --only-binary=:all: --dry-run -r requirements.lock
      - name: lock is up to date with pyproject.toml
        run: |
          pip install uv==0.11.16
          uv pip compile pyproject.toml --generate-hashes --python-version 3.12 \
            --python-platform x86_64-manylinux_2_28 -o /tmp/requirements.lock
          diff <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/requirements.lock)
  installer-containers:
    # install.sh on a server WITHOUT the WEB proxy must exit 1 and change nothing (PLAN 10).
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: ["public.ecr.aws/docker/library/ubuntu:24.04", "public.ecr.aws/docker/library/debian:13"]  # ECR mirror: no Docker Hub pull limit
    steps:
      - uses: actions/checkout@v4
      - name: installer refuses a server without the proxy
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD:/src:ro" "${{ matrix.image }}" \
            bash /src/scripts/installer-container-check.sh
  real-tools:
    # Our rendered files against the REAL upstream tools (not our fakes): tproxy-server -check,
    # caddy validate, nft -c, systemd-analyze verify.
    runs-on: ubuntu-24.04
    env:
      UPSTREAM_COMMIT: c8adb8b7c6b7fc46c12ae3acb68be9070c26a8e8
      CADDY_VERSION: "2.10.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: build upstream tproxy-server at the pinned commit
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          git clone https://github.com/telegramdesktop/tproxy-server "$RUNNER_TEMP/up"
          git -C "$RUNNER_TEMP/up" checkout "$UPSTREAM_COMMIT"
          (cd "$RUNNER_TEMP/up" && go build -o "$RUNNER_TEMP/bin/tproxy-server" ./cmd/tproxy-server)
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: render our files (clean, owner, 300 users at 128/1024/4096 sessions)
        run: python tests/tools/render_for_upstream.py "$RUNNER_TEMP/render"
      - name: tproxy-server -check on every rendered scenario
        run: |
          for d in "$RUNNER_TEMP"/render/*/; do
            echo "== $d"
            tproxy-server -config "$d/config.json" -profiles-file "$d/profiles.json" -check
          done
      - name: install caddy (release binary, checksum verified)
        run: |
          base="https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          echo "626682d623ca04356ab3c9a93a82386cfde6d8243b11f2d0eea9e97ba630c7ada62373401e96b72c6690c98ae8dd004d61fafe477f5249690d5cb251ebbfd2d9  caddy_${CADDY_VERSION}_linux_amd64.tar.gz" | sha512sum -c -
          tar -xzf "caddy_${CADDY_VERSION}_linux_amd64.tar.gz" caddy
          mv caddy "$RUNNER_TEMP/bin/caddy"
      - name: caddy validate (upstream Caddyfile + our block)
        env:
          TPROXY_HOSTNAME: proxy.example.com
          TPROXY_SITE_ROOT: /srv/tproxy-site
          ACME_EMAIL: admin@example.com
        run: |
          for d in "$RUNNER_TEMP"/render/*/; do
            caddy validate --config "$d/Caddyfile" --adapter caddyfile
          done
      - name: nft -c on the rendered ruleset (check-only)
        run: |
          sudo apt-get install -y -qq nftables >/dev/null
          for d in "$RUNNER_TEMP"/render/*/; do
            sudo nft -c -f "$d/tgpanel.nft"  # check-only: parses and validates, changes nothing
          done
      - name: systemd-analyze verify (shipped units + rendered pool unit)
        run: |
          sudo mkdir -p /opt/tgpanel/.venv/bin /opt/tgpanel/scripts /opt/MTProxy/objs/bin /var/lib/mtproxy
          sudo touch /opt/tgpanel/.venv/bin/python /opt/tgpanel/scripts/restart-pools.sh /opt/MTProxy/objs/bin/mtproto-proxy
          sudo chmod +x /opt/tgpanel/.venv/bin/python /opt/tgpanel/scripts/restart-pools.sh /opt/MTProxy/objs/bin/mtproto-proxy
          units="$RUNNER_TEMP/units"
          mkdir -p "$units"
          cp deploy/tgpanel.service deploy/tgpanel-firewall.service \
            deploy/tgpanel-mtproxy-refresh.path deploy/tgpanel-mtproxy-refresh.service "$units/"
          cp "$RUNNER_TEMP/render/clean/tgpanel-mtproxy@.service" "$units/"
          systemd-analyze verify --man=no "$units"/tgpanel.service "$units"/tgpanel-firewall.service \
            "$units"/tgpanel-mtproxy-refresh.path "$units"/tgpanel-mtproxy-refresh.service \
            "$units/tgpanel-mtproxy@.service"
